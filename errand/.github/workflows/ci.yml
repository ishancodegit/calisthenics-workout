name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The desktop shell links against WebKit, so the shell's tests need it
      # even though core/ deliberately does not.
      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            src-tauri

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Agent loop and tools
        run: npm test

      # The desktop shell embeds the built frontend at compile time, so this
      # has to happen before any cargo step — dist/ is not committed.
      - name: Build the frontend
        run: npm run build

      - name: The rules that protect people's files
        run: cargo test --manifest-path core/Cargo.toml

      - name: What the agent is allowed to fetch
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Formatting
        run: |
          cargo fmt --manifest-path core/Cargo.toml -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lints
        run: |
          cargo clippy --manifest-path core/Cargo.toml -- -D warnings
